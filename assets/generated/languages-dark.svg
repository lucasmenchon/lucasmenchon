<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330" role="img" aria-label="Most used languages: C#, Vue, C, HTML, CSS, TypeScript, Other">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
  </style>
  <rect x="1" y="1" width="588" height="328" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="40" y="58" class="sans" font-size="23" font-weight="700" fill="#e6edf3">Languages</text>
  <text x="40" y="82" class="mono" font-size="13.5" fill="#8b949e">// by bytes across original repos</text>
  <clipPath id="bar"><rect x="40" y="104" width="510" height="14" rx="7"/></clipPath>
  <g clip-path="url(#bar)"><rect x="40" y="104" width="510" height="14" fill="#1f242c"/><rect class="grow" style="animation-delay:0.20s" x="40.0" y="104" width="182.2" height="14" fill="#178600"/><rect class="grow" style="animation-delay:0.28s" x="224.2" y="104" width="175.7" height="14" fill="#41b883"/><rect class="grow" style="animation-delay:0.36s" x="402.0" y="104" width="49.6" height="14" fill="#a8b9cc"/><rect class="grow" style="animation-delay:0.44s" x="453.6" y="104" width="32.7" height="14" fill="#e34c26"/><rect class="grow" style="animation-delay:0.52s" x="488.2" y="104" width="26.6" height="14" fill="#663399"/><rect class="grow" style="animation-delay:0.60s" x="516.9" y="104" width="20.6" height="14" fill="#3178c6"/><rect class="grow" style="animation-delay:0.68s" x="539.5" y="104" width="8.5" height="14" fill="#484f58"/></g>
  <g class="fade" style="animation-delay:0.30s">
    <circle cx="51" cy="160" r="7" fill="#178600"/>
    <text x="68" y="166" class="sans" font-size="18" font-weight="600" fill="#e6edf3">C#</text>
    <text x="274" y="166" text-anchor="end" class="mono" font-size="15" fill="#8b949e">36.1%</text>

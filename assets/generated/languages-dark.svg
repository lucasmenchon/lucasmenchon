    <text x="274" y="246" text-anchor="end" class="mono" font-size="15" fill="#8b949e">5.6%</text>
  </g>
  <g class="fade" style="animation-delay:0.65s">
    <circle cx="316" cy="240" r="7" fill="#3178c6"/>
    <text x="333" y="246" class="sans" font-size="18" font-weight="600" fill="#e6edf3">TypeScript</text>
    <text x="539" y="246" text-anchor="end" class="mono" font-size="15" fill="#8b949e">4.4%</text>

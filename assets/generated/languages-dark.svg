  </g>
  <g class="fade" style="animation-delay:0.44s">
    <circle cx="51" cy="200" r="7" fill="#a8b9cc"/>
    <text x="68" y="206" class="sans" font-size="18" font-weight="600" fill="#e6edf3">C</text>
    <text x="274" y="206" text-anchor="end" class="mono" font-size="15" fill="#8b949e">10.1%</text>

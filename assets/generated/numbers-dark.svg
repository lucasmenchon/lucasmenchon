<svg xmlns="http://www.w3.org/2000/svg" width="590" height="330" viewBox="0 0 590 330" role="img" aria-label="GitHub statistics">
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .6s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    
    
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
  </style>
  <rect x="1" y="1" width="588" height="328" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <text x="40" y="58" class="sans" font-size="23" font-weight="700" fill="#e6edf3">GitHub in numbers</text>
  <text x="40" y="82" class="mono" font-size="13.5" fill="#8b949e">// live from the GitHub API</text>
  <g class="fade" style="animation-delay:0.15s">
  <text x="40" y="158" class="sans" font-size="36" font-weight="800" fill="#a78bfa">15</text>
  <text x="40" y="184" class="sans" font-size="15.5" fill="#8b949e">stars earned</text></g>
  <g class="fade" style="animation-delay:0.23s">
  <text x="220" y="158" class="sans" font-size="36" font-weight="800" fill="#58a6ff">9</text>
  <text x="220" y="184" class="sans" font-size="15.5" fill="#8b949e">original repos</text></g>
  <g class="fade" style="animation-delay:0.31s">
  <text x="400" y="158" class="sans" font-size="36" font-weight="800" fill="#22d3ee">49</text>
  <text x="400" y="184" class="sans" font-size="15.5" fill="#8b949e">followers</text></g>
  <g class="fade" style="animation-delay:0.39s">
  <text x="40" y="262" class="sans" font-size="36" font-weight="800" fill="#f778ba">61</text>
  <text x="40" y="288" class="sans" font-size="15.5" fill="#8b949e">commits (12 mo)</text></g>
  <g class="fade" style="animation-delay:0.47s">
  <text x="220" y="262" class="sans" font-size="36" font-weight="800" fill="#3fb950">12</text>
  <text x="220" y="288" class="sans" font-size="15.5" fill="#8b949e">pull requests</text></g>
  <g class="fade" style="animation-delay:0.55s">
  <text x="400" y="262" class="sans" font-size="36" font-weight="800" fill="#d29922">5y+</text>
  <text x="400" y="288" class="sans" font-size="15.5" fill="#8b949e">on GitHub</text></g>
</svg>

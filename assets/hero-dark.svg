<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Menchon — Full Stack .NET Developer</title>
  <desc id="desc">Lucas Menchon, Full Stack .NET Developer from São Paulo, Brazil. A terminal boots his profile like an ASP.NET Core app.</desc>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="nameShine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;760 0;760 0" keyTimes="0;.45;1" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#2563eb" stop-opacity="0.35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#21262d" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="8s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="440" fill="url(#fade)"/></mask>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.09"/>
    </linearGradient>
    <clipPath id="term"><rect x="631" y="91" width="528" height="303" rx="12"/></clipPath>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="438" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14.5px; }
    .line { opacity: 0; animation: in .45s ease-out forwards; }
    .chip { opacity: 0; animation: in .6s ease-out forwards; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
    .typer { animation: type 1.6s steps(33) .3s forwards; }
    .blink { animation: blink 1.1s step-end infinite; }
    .orbA { animation: driftA 14s ease-in-out infinite alternate; }
    .orbB { animation: driftB 18s ease-in-out infinite alternate; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    .mote { opacity: 0; animation: float 14s linear infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    .scan { animation: scan 5s ease-in-out 4.51s infinite; opacity: 0; }
    .underline { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.2s cubic-bezier(.65,0,.35,1) .6s forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes type { to { transform: translateX(299.09999999999997px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes driftA { to { transform: translate(90px, 40px); } }
    @keyframes driftB { to { transform: translate(-80px, -30px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes float { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: .7; } 85% { opacity: .5; } 100% { opacity: 0; transform: translateY(-240px); } }
    @keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan { 0% { opacity: 0; transform: translateY(0); } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translateY(265px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    
    @keyframes show0 { 0%, 0.00% { opacity: 0; } 0.07%, 33.26% { opacity: 1; } 33.33%, 100% { opacity: 0; } }
    @keyframes type0 {
      0%, 0.00% { transform: translateX(0); animation-timing-function: steps(27); }
      10.37% { transform: translateX(248.9px); }
      28.15% { transform: translateX(248.9px); animation-timing-function: steps(27); }
      32.96%, 100% { transform: translateX(0); }
    }
    @keyframes caret0 {
      0%, 0.00% { transform: translateX(0); animation-timing-function: steps(27); }
      10.37% { transform: translateX(234.9px); }
      28.15% { transform: translateX(234.9px); animation-timing-function: steps(27); }
      32.96%, 100% { transform: translateX(0); }
    }
    @keyframes show1 { 0%, 33.33% { opacity: 0; } 33.41%, 66.59% { opacity: 1; } 66.67%, 100% { opacity: 0; } }
    @keyframes type1 {
      0%, 33.33% { transform: translateX(0); animation-timing-function: steps(29); }
      43.70% { transform: translateX(266.3px); }
      61.48% { transform: translateX(266.3px); animation-timing-function: steps(29); }
      66.30%, 100% { transform: translateX(0); }
    }
    @keyframes caret1 {
      0%, 33.33% { transform: translateX(0); animation-timing-function: steps(29); }
      43.70% { transform: translateX(252.3px); }
      61.48% { transform: translateX(252.3px); animation-timing-function: steps(29); }
      66.30%, 100% { transform: translateX(0); }
    }
    @keyframes show2 { 0%, 66.67% { opacity: 0; } 66.74%, 99.93% { opacity: 1; } 100.00%, 100% { opacity: 0; } }
    @keyframes type2 {
      0%, 66.67% { transform: translateX(0); animation-timing-function: steps(29); }
      77.04% { transform: translateX(266.3px); }
      94.81% { transform: translateX(266.3px); animation-timing-function: steps(29); }
      99.63%, 100% { transform: translateX(0); }
    }
    @keyframes caret2 {
      0%, 66.67% { transform: translateX(0); animation-timing-function: steps(29); }
      77.04% { transform: translateX(252.3px); }
      94.81% { transform: translateX(252.3px); animation-timing-function: steps(29); }
      99.63%, 100% { transform: translateX(0); }
    }
    
    .comet { animation: orbit var(--dur, 9s) linear infinite; }
    .shine { animation: sweep var(--dur, 7s) cubic-bezier(.4,0,.2,1) infinite; }
    .pop { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.34,1.56,.64,1) forwards; }
    .cu { opacity: 0; }
    @keyframes orbit { to { stroke-dashoffset: -1000; } }
    @keyframes sweep { 0% { transform: translateX(0); } 30%, 100% { transform: translateX(var(--to, 1600px)); } }
    @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes cuf { from, to { opacity: 1; } }
    @keyframes cul { to { opacity: 1; } }
    
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
  </style>


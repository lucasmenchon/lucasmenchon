    <rect x="630" y="50" width="530" height="345" rx="14" fill="#0f141b" stroke="#30363d"/>
    <path d="M630 90H1160" stroke="#30363d"/>
    <circle cx="652" cy="70" r="6" fill="#ff5f57"/>
    <circle cx="672" cy="70" r="6" fill="#febc2e"/>

      <text x="278.9" y="340" class="sans" font-size="13.5" fill="#e6edf3">Building at Olik</text>
    </g>
    <g class="chip" style="animation-delay:0.74s">
      <rect x="422.1" y="318" width="192.3" height="34" rx="17" fill="#0f141b" stroke="#30363d"/>

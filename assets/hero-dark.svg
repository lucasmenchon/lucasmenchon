  <!-- identity -->
  <g class="rise">
    <text x="60" y="104" class="mono" font-size="15" fill="#8b949e"><tspan fill="#a78bfa">public sealed class</tspan> Developer</text>
  </g>
  <g class="rise" style="animation-delay:.1s">
    <text x="56" y="182" class="sans" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#name)">Lucas Menchon</text>
    <text x="56" y="182" class="sans" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#nameShine)" aria-hidden="true">Lucas Menchon</text>
    <path class="underline" d="M60 198H470" stroke="url(#name)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="rise" style="animation-delay:.2s">
    <text x="60" y="236" class="sans" font-size="23" font-weight="600" fill="#e6edf3">Full Stack .NET Developer</text>
    <text x="60" y="270" class="sans" font-size="16.5" fill="#8b949e">Building fast, clean and reliable software —</text>
    <text x="60" y="294" class="sans" font-size="16.5" fill="#8b949e">from the database all the way to the pixel.</text>
  </g>
  
    <g class="chip" style="animation-delay:0.50s">
      <rect x="60" y="318" width="176.9" height="34" rx="17" fill="#0f141b" stroke="#30363d"/>
      <circle cx="79" cy="335" r="4" fill="#a78bfa"/><circle class="ping" cx="79" cy="335" r="4" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="94" y="340" class="sans" font-size="13.5" fill="#e6edf3">São Paulo, Brazil</text>
    </g>
    <g class="chip" style="animation-delay:0.62s">

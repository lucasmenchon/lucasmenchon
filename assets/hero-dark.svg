    <text x="654" y="153" class="mono line" style="animation-delay:1.95s"><tspan fill="#8b949e">  Building...</tspan></text>
    <text x="654" y="178" class="mono line" style="animation-delay:2.27s"><tspan fill="#3fb950" font-weight="700">info</tspan><tspan fill="#8b949e">: Microsoft.Hosting.Lifetime[14]</tspan></text>
    <text x="654" y="203" class="mono line" style="animation-delay:2.59s"><tspan fill="#e6edf3">      Now listening on: </tspan><tspan fill="#a78bfa">https://lucas.ee</tspan></text>
    <text x="654" y="228" class="mono line" style="animation-delay:2.91s"><tspan fill="#3fb950" font-weight="700">info</tspan><tspan fill="#8b949e">: Lucas.Menchon.Profile[0]</tspan></text>
    <text x="654" y="253" class="mono line" style="animation-delay:3.23s"><tspan fill="#e6edf3">      Role: </tspan><tspan fill="#a78bfa">Full Stack .NET Developer</tspan></text>
    <text x="654" y="278" class="mono line" style="animation-delay:3.55s"><tspan fill="#e6edf3">      Stack: </tspan><tspan fill="#a78bfa">C# · ASP.NET Core · Angular · React · Vue</tspan></text>
    <text x="654" y="303" class="mono line" style="animation-delay:3.87s"><tspan fill="#3fb950" font-weight="700">info</tspan><tspan fill="#8b949e">: Microsoft.Hosting.Lifetime[0]</tspan></text>

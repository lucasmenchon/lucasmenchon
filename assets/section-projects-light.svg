<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="git log --featured // selected C# projects">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset=".5" stop-color="#0969da"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typed"><rect class="reveal" x="42" y="10" width="333.8" height="56"/></clipPath>
    <radialGradient id="glow"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .reveal { transform: translateX(-333.8px); animation: reveal 1.43s steps(18) .2s forwards; }
    .caret { animation: caret 1.43s steps(18) .2s forwards; }
    .blink { animation: blink 1.1s step-end infinite; }
    .rule { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.4s cubic-bezier(.65,0,.35,1) .3s forwards; }
    .note { opacity: 0; animation: in .7s ease-out 1.63s forwards; }
    .runner { animation: run 6s cubic-bezier(.45,0,.55,1) 1.6s infinite; opacity: 0; }
    @keyframes reveal { to { transform: translateX(0); } }
    @keyframes caret { to { transform: translateX(325.8px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
    @keyframes run { 0% { opacity: 0; transform: translateX(0); } 8% { opacity: 1; } 80% { opacity: .8; } 100% { opacity: 0; transform: translateX(1060px); } }
    
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
  </style>
  <text x="8" y="50" font-family="'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="30" font-weight="700" fill="#1a7f37">❯</text>
  <text x="44" y="50" clip-path="url(#typed)" font-family="'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="30" font-weight="700" fill="#1f2328">git log --featured</text>
  <g class="caret"><rect class="blink" x="48" y="24" width="15" height="32" rx="2" fill="#6d28d9"/></g>
  <text class="note" x="1192" y="48" text-anchor="end" font-family="'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" fill="#59636e">// selected C# projects</text>
  <path d="M8 80H1192" stroke="#d0d7de" stroke-width="1"/>
  <path class="rule" d="M8 80H1192" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round"/>
  <g class="runner"><circle cx="20" cy="80" r="14" fill="url(#glow)" opacity=".6"/><circle cx="20" cy="80" r="3" fill="#0969da"/></g>
</svg>
